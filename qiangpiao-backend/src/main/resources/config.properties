# ==================== 数据源 Druid ====================
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://127.0.0.1:3306/qiangpiao?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=412826
jdbc.initialSize=5
jdbc.minIdle=5
jdbc.maxActive=50
jdbc.maxWait=60000
jdbc.validationQuery=SELECT 1
jdbc.testWhileIdle=true
jdbc.testOnBorrow=false
jdbc.testOnReturn=false
jdbc.filters=stat,wall,slf4j

# ==================== 慢 SQL ====================
# 执行耗时超过该值(毫秒)的 SQL 单独输出到 D:\rizi1\qiangpiao\SQL\slow-sql-yyyy-MM-dd.log
sql.slow-threshold-ms=100

# ==================== Redis（L2 缓存 / 秒杀库存 / 分布式锁） ====================
redis.host=127.0.0.1
redis.port=6379
redis.password=
redis.database=0
redis.timeout=5000
# 缓存默认 TTL（秒）
cache.default-ttl=300

# ==================== 本地缓存 Caffeine（L1） ====================
cache.local.max-size=10000
cache.local.ttl=60

# ==================== JWT ====================
jwt.secret=qiangpiao-seckill-secret-key-please-change-in-production-2026
jwt.expiration=7200
jwt.header=Authorization
jwt.token-prefix=Bearer

# ==================== 秒杀 ====================
# 单用户窗口内最多请求次数（滑动窗口）
seckill.user-limit=20
seckill.user-window-seconds=60
# IP 维度限流：同一 IP 窗口内最多请求次数
seckill.ip-limit=30
seckill.ip-window-seconds=60
# 全局维度限流（令牌桶）：桶容量 = 允许的突发量，refill = 长期每秒放行量
seckill.global-capacity=5000
seckill.global-refill=1000
# 抢票前置人机验证开关（true = 每次抢票都要先过图形验证码或滑块）
seckill.captcha-enabled=true

# ==================== 风控 ====================
# 同一 IP 在 30 分钟内关联账号数阈值，超过即标记
risk.ip-multi-account=3
# 同一账号两次抢票最小间隔（毫秒），低于此值视为脚本
risk.min-interval-ms=500
# 累计命中达到该次数自动拉黑 IP
risk.auto-block-count=5
# 自动拉黑时长（秒）
risk.block-seconds=1800
# 订单支付超时时间（分钟）
order.pay-timeout-minutes=5

# ==================== 支付（模拟渠道，两阶段：发起支付 + 异步回调） ====================
# 回调验签密钥（生产环境由渠道下发，切勿泄露）
pay.secret=qiangpiao-pay-mock-secret-please-change-2026
# 回调时间戳有效窗口（毫秒），超出视为过期报文
pay.notify-timestamp-window-ms=300000
# 回调 nonce 防重放缓存时间（秒）
pay.notify-nonce-ttl=600
# 支付单有效期（分钟），与订单支付超时取较小值
pay.session-minutes=5
# 模拟渠道异步回调延迟（毫秒）：发起支付后多久回调 /api/payments/notify
pay.mock-callback-delay-ms=3000

# ==================== 敏感字段加密（身份证：明文传入 / 密文落库） ====================
# AES 密钥，长度必须 16 / 24 / 32 字节；生产环境请更换并妥善保管，泄露等于明文
crypto.aes-key=Qp@IdCard2026Key
# 开发测试白名单：身份证 111111 开头、手机号 111 开头跳过格式校验（方便造测试数据）
# ⚠️ 生产环境必须改为 false
crypto.test-whitelist=true

# ==================== 售票规则（12306 同款） ====================
# 可查询 / 可预订的日期范围（天）：今天起 N 天内
ticket.query-days=30
# 预售期（天）：只能预售今天起 N 天内的车票
ticket.presale-days=14
# 开车前多少分钟停止售票
ticket.stop-sell-minutes=20

# ==================== 退票 / 改签手续费（12306 阶梯规则） ====================
# 春运时段：改签后车票的乘车日期落在该区间内，退票一律按 20% 收取退票费（留空表示不启用）
ticket.spring-festival-start=2027-01-22
ticket.spring-festival-end=2027-03-02
