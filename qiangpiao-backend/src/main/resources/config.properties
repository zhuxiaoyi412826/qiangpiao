# ==================== 数据源 Druid ====================
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://127.0.0.1:3306/qiangpiao?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=412826
jdbc.initialSize=5
jdbc.minIdle=5
jdbc.maxActive=50
jdbc.maxWait=60000
jdbc.validationQuery=SELECT 1
jdbc.testWhileIdle=true
jdbc.testOnBorrow=false
jdbc.testOnReturn=false
jdbc.filters=stat,wall,slf4j

# ==================== 慢 SQL ====================
# 执行耗时超过该值(毫秒)的 SQL 单独输出到 D:\rizi1\qiangpiao\SQL\slow-sql-yyyy-MM-dd.log
sql.slow-threshold-ms=100

# ==================== Redis（L2 缓存 / 秒杀库存 / 分布式锁） ====================
redis.host=127.0.0.1
redis.port=6379
redis.password=
redis.database=0
redis.timeout=5000
# 缓存默认 TTL（秒）
cache.default-ttl=300

# ==================== 本地缓存 Caffeine（L1） ====================
cache.local.max-size=10000
cache.local.ttl=60

# ==================== JWT ====================
jwt.secret=qiangpiao-seckill-secret-key-please-change-in-production-2026
jwt.expiration=7200
jwt.header=Authorization
jwt.token-prefix=Bearer

# ==================== 秒杀 ====================
# 单用户窗口内最多请求次数（滑动窗口）
seckill.user-limit=20
seckill.user-window-seconds=60
# IP 维度限流：同一 IP 窗口内最多请求次数
seckill.ip-limit=30
seckill.ip-window-seconds=60
# 全局维度限流（令牌桶）：桶容量 = 允许的突发量，refill = 长期每秒放行量
seckill.global-capacity=5000
seckill.global-refill=1000
# 抢票前置人机验证开关（true = 每次抢票都要先过图形验证码或滑块）
seckill.captcha-enabled=true
# 下单任务队列：true = 写 Redis Stream（进程重启/宕机不丢任务，推荐）；
# false = 退回内存线程池（原实现，宕机会丢失「已扣库存但未成单」的任务）
seckill.task-queue-enabled=true
# 单次最多拉取多少条任务
seckill.task-batch-size=20
# 阻塞读超时（毫秒），到点没有新任务就转去巡检 pending
seckill.task-block-ms=2000
# pending 巡检间隔（毫秒）：重启后先把未确认的任务捞回来重投
seckill.task-claim-interval-ms=15000
# pending 空闲超过该时长即判定「处理它的进程已挂」，重新投递
seckill.task-claim-idle-ms=30000
# 单条任务最大投递次数，超过则补偿回滚库存并标记失败（防无限重试）
seckill.task-max-deliveries=3
# Stream 最大长度（约数，超出自动裁剪，避免长期运行后无限膨胀）
seckill.task-stream-max-len=100000

# ==================== 风控 ====================
# 同一 IP 在 30 分钟内关联账号数阈值，超过即标记
risk.ip-multi-account=3
# 同一账号两次抢票最小间隔（毫秒），低于此值视为脚本
risk.min-interval-ms=500
# 累计命中达到该次数自动拉黑 IP
risk.auto-block-count=5
# 自动拉黑时长（秒）
risk.block-seconds=1800
# 订单支付超时时间（分钟）
order.pay-timeout-minutes=5

# ==================== 支付（模拟渠道，两阶段：发起支付 + 异步回调） ====================
# 回调验签密钥（生产环境由渠道下发，切勿泄露）
pay.secret=qiangpiao-pay-mock-secret-please-change-2026
# 回调时间戳有效窗口（毫秒），超出视为过期报文
pay.notify-timestamp-window-ms=300000
# 回调 nonce 防重放缓存时间（秒）
pay.notify-nonce-ttl=600
# 支付单有效期（分钟），与订单支付超时取较小值
pay.session-minutes=5
# 模拟渠道异步回调延迟（毫秒）：发起支付后多久回调 /api/payments/notify
# 给页面留出 15 秒手动选择「支付成功 / 支付失败」的窗口，超时未选才自动回调成功
pay.mock-callback-delay-ms=15000
# 模拟渠道是否在发起支付后自动回调成功：
#   true（默认）= 延迟 pay.mock-callback-delay-ms 后自动成功；期间页面可手动改判，先点先生效
#   false      = 完全由支付弹窗手动选择结果，永不自动回调（想反复演示失败链路时改这个）
pay.mock-auto-callback=true

# ==================== 敏感字段加密（身份证：明文传入 / 密文落库） ====================
# AES 密钥，长度必须 16 / 24 / 32 字节；生产环境请更换并妥善保管，泄露等于明文
crypto.aes-key=Qp@IdCard2026Key
# 开发测试白名单：身份证 111111 开头、手机号 111 开头跳过格式校验（方便造测试数据）
# ⚠️ 生产环境必须改为 false
crypto.test-whitelist=true

# ==================== 钱包 ====================
# 新用户注册即自动开通钱包，并赠送的初始余额（单位：元）
# 置为 0 表示只开户、不赠送
wallet.register-gift-amount=1000.00

# ==================== 库存对账（比对 Redis 库存 / DB 余票 / 物理可售座位） ====================
# 是否开启
stock.reconcile-enabled=true
# 发现漂移后是否自动校准（false = 只打告警日志不改数据，上线观察期用）
stock.reconcile-fix-enabled=true
# 区间票模式下是否仍按「物理座位数」校准 DB 余票：
# 区间票的座位可复用（同一座位卖 A-B 后还能卖 B-C），此时可售座位数天然少于 DB 余票，
# 属设计内差异，故默认 false（只告警）；确认库里没有区间复用后再改 true
stock.reconcile-seat-fix-enabled=false
# 同一处漂移连续观察到几次才动手校准：
# 抢票期间「Redis 已扣、订单未落库」是正常在途差，采样一次就修会把票多放出去
stock.reconcile-drift-threshold=2
# 每轮扫描的车次分页大小
stock.reconcile-page-size=100
# 对账周期（毫秒）：默认 10 分钟一轮
stock.reconcile-interval-ms=600000
# 启动后首次对账的延迟（毫秒）：等预热任务先把库存灌进 Redis
stock.reconcile-initial-delay-ms=180000

# ==================== 资金对账（扣款 / 收入最终一致性校验 + 异常单据 + 人工审核） ====================
# 是否开启对账 Job（建表脚本见 scripts/sql/fund_reconcile.sql，没建表前请关掉）
fund.reconcile-enabled=true
# 回看窗口（小时）：只扫这段时间内有资金动作的业务对象，历史订单无需反复核对
fund.reconcile-lookback-hours=24
# 钱包分页大小（校验「余额 == 流水累计」时逐页扫全量钱包）
fund.reconcile-wallet-page-size=200
# 每轮最多复查多少张待审核单据（判断差异是否已自行恢复，恢复则自动关闭）
fund.reconcile-verify-limit=200
# 金额容差（元）：分币级误差不算差异
fund.reconcile-amount-tolerance=0.01
# 对账周期（毫秒）：默认 30 分钟一轮
fund.reconcile-interval-ms=1800000
# 启动后首次对账的延迟（毫秒）
fund.reconcile-initial-delay-ms=300000

# ==================== 中转方案（基于 t_train_stop 经停站做路径规划） ====================
# 是否开启中转方案推荐；库里还没维护时刻表时关掉，免得每次查询都白扫一遍表
route.plan-enabled=true
# 是否把次日车次也纳入候选：true 才能算出「今晚到中转站、明早接续」的跨天方案
route.plan-next-day=true
# 区间计价模式：
#   full     = 每段票价取席别全程价（与实际下单扣款口径一致，中转总价偏保守，不会误导用户）
#   distance = 按里程比例折算区间价（贴近直觉，但与实收金额会有出入，仅用于方案比价）
route.price-mode=full
# TIME 排序口径下，每次换乘额外折算的分钟数（换乘本身很折腾，等效加时）
route.transfer-penalty-minutes=30
# 参与建图的最大车次数，超出只取前 N 趟（防止数据量把查询拖垮）
route.max-trains=200

# ==================== 售票规则（12306 同款） ====================
# 可查询 / 可预订的日期范围（天）：今天起 N 天内
ticket.query-days=30
# 预售期（天）：只能预售今天起 N 天内的车票
ticket.presale-days=14
# 开车前多少分钟停止售票
ticket.stop-sell-minutes=20

# ==================== 退票 / 改签手续费（12306 阶梯规则） ====================
# 春运时段：改签后车票的乘车日期落在该区间内，退票一律按 20% 收取退票费（留空表示不启用）
ticket.spring-festival-start=2027-01-22
ticket.spring-festival-end=2027-03-02
